# Test-only PostgreSQL 16 service. Credentials are throwaway values.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tester
      POSTGRES_DB: intel_approval_test
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
    ports:
      - "127.0.0.1:55427:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tester -d intel_approval_test"]
      interval: 5s
      timeout: 3s
      retries: 10
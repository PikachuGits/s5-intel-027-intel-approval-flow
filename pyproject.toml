[project]
name = "s5-intel-027-intel-approval-flow"
version = "1.0.0"
description = "S5-INTEL-027: supervisor approval flow and state machine for intel items"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "SQLAlchemy>=2.0.36,<2.2",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"